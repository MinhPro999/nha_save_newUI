name: flutter_core_project
description: Construction Plan mobile application.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.5+1

environment:
  sdk: '>=3.1.4 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_bloc: ^8.1.6
  hydrated_bloc: ^9.1.5
  path_provider: ^2.1.6
  flutter_native_splash: ^2.4.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  dio: ^5.11.0
  equatable: ^2.1.0
  get_it: ^9.2.1
  shared_preferences: ^2.5.5
  pretty_dio_logger: ^1.4.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  flutter_dotenv: ^6.0.1
  image_picker: ^1.2.0
  flutter_image_compress: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  sqflite_common_ffi: ^2.3.3
  bloc_test: ^9.1.7

# firebase_core_web 3.11.0 dùng `isA` trên Object (chỉ có từ Dart 3.12),
# gây lỗi "The method 'isA' isn't defined for the type 'Object'" với Dart 3.10.7.
# Ghim xuống 3.10.0 cho tới khi FlutterFire phát hành bản đã sửa.
dependency_overrides:
  firebase_core_web: 3.10.0

flutter:

  # Keep IDE-generated Run configurations on the development environment.
  default-flavor: dev

  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
    - assets/images/projects/
    - assets/vectors/
    - assets/fonts/
    - lib/l10n/
    - .env.dev
    - .env.prod

  fonts:
    # Be Vietnam Pro — hỗ trợ đầy đủ tiếng Việt & tiếng Anh
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Light.ttf
          weight: 300
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/BeVietnamPro-Italic.ttf
          style: italic
    # Satoshi — giữ lại để không bị lỗi nếu có chỗ còn dùng
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Black.ttf
          weight: 900
        - asset: assets/fonts/Satoshi-Bold.ttf
          weight: 600
        - asset: assets/fonts/Satoshi-Medium.ttf
          weight: 500
        - asset: assets/fonts/Satoshi-Regular.ttf
          weight: 400
        - asset: assets/fonts/Satoshi-Light.ttf
          weight: 300

# ─── Native Splash Screen ───────────────────────────────────────────────────
# Sau khi thay đổi config này, chạy: dart run flutter_native_splash:create
flutter_native_splash:
  # Màu nền trắng — khớp với SplashPage Flutter
  color: "#FFFFFF"
  color_dark: "#FFFFFF"

  # Logo splash có padding riêng, không bị stretch/crop.
  image: assets/images/splash_logo.png
  image_dark: assets/images/splash_logo.png

  # Hiển thị logo ở giữa màn hình, không scale lên đầy màn hình
  android_gravity: center
  ios_content_mode: center

  # Tắt fullscreen (giữ status bar bình thường)
  fullscreen: false

  # Android 12+ Splash API
  # ⚠️  Adaptive icon: logo phải nằm trong vùng 66% trung tâm của ảnh
  #     (1152×1152px, logo an toàn trong vòng tròn 672×672px ở giữa).
  #     Biến thể 960×960 bên dưới giữ logo trong vùng an toàn 640px.
  android_12:
    color: "#FFFFFF"
    color_dark: "#FFFFFF"
    image: assets/images/splash_logo_android12.png
    image_dark: assets/images/splash_logo_android12.png
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#FFFFFF"

#    flutter build appbundle --flavor prod -t lib/main_prod.dart
